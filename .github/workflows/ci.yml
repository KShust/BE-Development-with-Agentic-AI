# Continuous integration for the Customer Portal API.
#
# Runs the same gate as the local pre-commit sequence
# (.claude/skills/pre-commit-checklist/SKILL.md), in the same order, so a green
# checklist locally means a green pipeline. NFR-007: the build must pass before
# a change is considered complete.
#
# Integration tests run against a GitHub Actions native `services: postgres`
# instance on host port 5433 (docs/architecture/persistence-conventions.md PC-1).
# DATABASE_URL is supplied as a job-level environment variable, so CI never reads
# `.env.test` (plan D-4). It is job-level rather than step-level because
# `prisma.config.ts` resolves it eagerly (plan D-2), so `prisma generate` needs
# it too; `tests/support/globalSetup.ts` then applies the committed migrations
# with `prisma migrate deploy`.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/customer_portal_test

    # Disposable PostgreSQL for the integration tests (persistence-conventions.md
    # PC-1). Mapped to host port 5433, matching docker-compose.yml and .env.test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_portal_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_portal_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code, not committed. Every later step that
      # imports @prisma/client (typecheck, test, build) needs it to exist.
      - name: Generate Prisma client
        run: npx prisma generate

      # Structural integrity of the agentic harness: stage routing, the artifact
      # registry, Skill wiring, and the workflow state files must agree.
      - name: Validate harness
        run: npm run validate:harness

      # The validator is only worth its exit code if it has been seen to fail.
      - name: Test the harness validator
        run: npm run validate:harness:test

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # AC-10: the Zod schemas are the contract. Fails when the committed
      # document no longer matches what they generate.
      - name: Check OpenAPI drift
        run: npm run openapi:check

      # AD-2 / module-map.md: layering is enforced by ESLint, cycles are not -
      # ESLint sees one file at a time and cannot see a loop between modules.
      - name: Check circular dependencies
        run: npm run check:cycles

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Blocking, with named exceptions: every high/critical advisory must be
      # accepted by id in .audit-allowlist.json, with a reason and a review date.
      # An unlisted advisory fails the run; so does a listed one that has been
      # fixed upstream, so the exception list cannot quietly rot.
      - name: Audit dependencies
        run: npm run audit:check
