  - "Error codes assigned by API_DESIGN and now part of the contract (AC-6 makes renaming one a breaking change): VALIDATION_FAILED (400), MALFORMED_JSON (400), PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), RATE_LIMIT_EXCEEDED (429), INTERNAL_ERROR (500). EMAIL_ALREADY_REGISTERED (409) was already decided in AC-6 and was not reassigned. The five schema-failure cases share one code and are distinguished by details.fieldErrors, because AD-6 maps them all through a single ZodError branch with no throw site at which a per-case code could be supplied."
  - "Implementation consequence recorded by API_DESIGN, easy to miss and it would silently break VR-11: Zod reports an unrecognized body key as an issue whose path is the object root, so the default flattening leaves details.fieldErrors empty for the unknown-property 400. The contract keys that case by the offending property name, so the implementation must map the unrecognized-keys issue's own key list into fieldErrors rather than relying on the default helper."
  - "Left for IMPLEMENTATION_PLANNING, not blocking: express-rate-limit emits RateLimit-* headers by default and Retry-After on a 429. SC-3 decides the threshold and the mount point and says nothing about headers, and no requirement asks for them, so the contract declares none - declaring a response header the Specification does not require is what this stage's checklist forbids. The consequence is that the implementation emits headers the contract does not describe unless it disables them; either resolution is defensible and adding a declared header later is additive."
  - "DB_DESIGN finding, needs a human decision before IMPLEMENTATION: Prisma 7 requires a driver adapter on PrismaClient. In the installed @prisma/client 7.10.0 the PrismaClientOptions type is a union of exactly two shapes - one requiring accelerateUrl (Accelerate), one requiring adapter - and the type documents the adapter as required unless connecting through Accelerate. The official PostgreSQL adapter @prisma/adapter-pg and its pg driver are absent from package.json and node_modules (verified). That is a new dependency, which SC-6, SR-10 and the AGENTS.md Prohibited list make an explicit human decision. It changes nothing in the persistence model, so DB_DESIGN returned PASS, but src/lib/prisma.ts cannot construct a working client without it and US-001 cannot be implemented until it is approved. The implementation plan and HUMAN_PLAN_APPROVAL are the intended place."
  - "DB_DESIGN finding for IMPLEMENTATION_PLANNING: Prisma 7 no longer accepts url in the datasource block - url = env('DATABASE_URL') is validation error P1012 on 7.10.0, and prisma migrate status then reports that datasource.url is required in the Prisma config file (both verified by running the commands). US-001 must therefore add a prisma.config.ts carrying the migration connection URL, and that file has to read DATABASE_URL from the environment. AGENTS.md states flatly that process.env is read only in src/config/env.ts (AD-7), while the eslint rule enforcing it is scoped to files: [src/**/*.ts], so a root-level prisma.config.ts would pass npm run lint while contradicting the prose - the same position scripts/ already occupies. Either the config file reads the variable and AD-7 is narrowed to src/, or it imports the validated value; the plan should choose deliberately rather than let the lint silence decide."
  - "DB_DESIGN finding, recorded not specified: a database-level CHECK (email = lower(btrim(email))) would stop a future writer inserting an unnormalized address past the boundary, and PC-4 says a business invariant expressible as a database constraint is expressed as one. It is not in the design because no requirement asks for it and Prisma cannot express a CHECK in schema.prisma, so it would be raw SQL in the migration sitting outside what Prisma reconciles against. DESIGN_REVIEW can disagree with the judgement rather than have to notice the question."
  - "Recorded by DB_DESIGN for whoever takes the adapter decision: persistence-conventions.md PC-1 predates Prisma 7. What it says about DATABASE_URL and about one PrismaClient in src/lib/prisma.ts is still true; what it does not describe is that the client now needs an adapter object and that migrations read their URL from a separate config file. Amending a convention document is not a design stage decision, so the gap is recorded rather than closed."
